<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Brand-navy rounded-square background. Same shade as themeColor in
       layout.tsx (#0F0E22) so OS browser-chrome integrations look consistent. -->
