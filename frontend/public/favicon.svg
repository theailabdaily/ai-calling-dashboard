  <!-- Stylized phone-handset mark in brand pink. Curves suggest both
       a handset and a soundwave — fits "AI Calling Analytics" without
       being too literal. Rendered at 32x32; scales cleanly to 16. -->
  <path d="M 11.5 9 C 9.5 9 8 10.5 8 12.5 C 8 18.5 13.5 24 19.5 24 C 21.5 24 23 22.5 23 20.5 L 23 19 C 23 18.4 22.6 18 22 18 L 19.5 18 C 18.9 18 18.5 18.4 18.5 19 L 18.5 20 C 16 19.5 12.5 16 12 13.5 L 13 13.5 C 13.6 13.5 14 13.1 14 12.5 L 14 10 C 14 9.4 13.6 9 13 9 Z" fill="#E91E63"/>

  <!-- Three ascending bars suggesting analytics, top-right corner -->
  <rect x="20" y="11" width="1.5" height="2.5" rx="0.5" fill="#E91E63" opacity="0.6"/>
  <rect x="22.5" y="9" width="1.5" height="4.5" rx="0.5" fill="#E91E63" opacity="0.8"/>
</svg>
